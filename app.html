<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دانیا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#F3F4FA;
    --card:#FFFFFF;
    --ink:#181828;
    --ink-soft:#71718F;
    --ink-faint:#A5A5C0;
    --line:#E9E9F4;
    --primary:#5B47E0;
    --primary-light:#7A69E8;
    --primary-bg:#EEEBFC;
    --primary-grad:linear-gradient(135deg, var(--primary), var(--primary-light));
    --emerald:#0EA672;
    --emerald-bg:#E4F7EE;
    --rose:#E63B5C;
    --rose-bg:#FCE9ED;
    --amber:#DD9A1F;
    --shadow-sm:0 1px 2px rgba(24,24,40,.05);
    --shadow-md:0 6px 16px -4px rgba(24,24,40,.09), 0 2px 5px rgba(24,24,40,.05);
    --shadow-lg:0 24px 55px -14px rgba(24,24,40,.20), 0 4px 14px rgba(24,24,40,.06);
    --r-sm:10px;
    --r-md:14px;
    --r-lg:18px;
    --r-xl:22px;
  }
  html[data-theme="dark"]{
    --bg:#101018;
    --card:#1A1A29;
    --ink:#EDEDF6;
    --ink-soft:#A6A6C4;
    --ink-faint:#6D6D8E;
    --line:#28283C;
    --primary:#7C6BEF;
    --primary-light:#9689F3;
    --primary-bg:#26224A;
    --emerald:#34D399;
    --emerald-bg:#123527;
    --rose:#FB7185;
    --rose-bg:#3A1620;
    --amber:#F2B84B;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow-md:0 6px 18px -4px rgba(0,0,0,.4);
    --shadow-lg:0 24px 55px -14px rgba(0,0,0,.55);
  }
  html{transition:background-color .2s;}
  body{transition:background-color .2s, color .2s;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;min-height:100%;overflow:hidden;}
  body{
    font-family:'Vazirmatn',sans-serif;
    background:
      radial-gradient(720px 420px at 92% -8%, rgba(91,71,224,.07), transparent 60%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  html[data-theme="dark"] body{
    background:
      radial-gradient(720px 420px at 92% -8%, rgba(124,107,239,.12), transparent 60%),
      var(--bg);
  }
  .app{min-height:100vh;}
  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:10px;}
  .brand-left{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(155deg,var(--primary),var(--primary-light));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:16px;flex-shrink:0;
    box-shadow:var(--shadow-md);
  }
  /* Dania brand logo: purple in light mode, white in dark mode */
  .dania-logo-ui{display:block;width:132px;height:auto;object-fit:contain;flex:0 0 auto;}
  html[data-theme="dark"] .dania-logo-ui{filter:brightness(0) invert(1);}
  .sidebar-logo .dania-logo-ui{width:132px;}
  .auth-brand-logo{width:min(128px,38vw);height:auto;margin:0 auto;}
  #auth-card input,#auth-card select{height:44px;padding:0 13px;font-size:14px;box-sizing:border-box;border-radius:10px;}
  #auth-card .pw-wrap input{padding-left:40px;}
  #auth-card .btn{height:44px;padding:0 16px;font-size:14px;font-weight:700;border-radius:10px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;}
  #forgot-password{position:relative;transition:color .18s ease,transform .18s ease,background .18s ease;border-radius:7px;}
  #forgot-password:hover{color:var(--primary-light)!important;background:var(--primary-soft);transform:translateY(-1px);text-decoration:none;}
  #forgot-password:focus-visible{outline:2px solid var(--primary-light);outline-offset:3px;}
  .loading-logo{
    width:104px;height:104px;min-width:104px;min-height:104px;margin:0 auto 18px;
    border-radius:0;background:transparent;color:inherit;display:flex;align-items:center;
    justify-content:center;box-shadow:none;animation:none;
  }
  .loading-logo .dania-logo-ui{width:104px;height:104px;object-fit:cover;border-radius:28px;display:block;box-shadow:0 16px 38px rgba(91,71,224,.28);}
  html[data-theme="dark"] .loading-logo .dania-logo-ui{filter:none;}
  .brand h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.2px;}
  .brand span{font-size:12.5px;color:var(--ink-faint);}
  .tabs{display:inline-flex;gap:2px;margin-bottom:24px;background:var(--card);padding:4px;border-radius:12px;box-shadow:var(--shadow-sm);border:1px solid var(--line);}
  .tab-btn{
    font-family:inherit;font-size:14px;font-weight:600;
    background:transparent;border:none;border-radius:9px;
    color:var(--ink-soft);padding:9px 18px;cursor:pointer;transition:.15s;
  }
  .tab-btn.active{color:#fff;background:var(--primary);box-shadow:var(--shadow-sm);}
  .tab-btn:not(.active):hover{color:var(--ink);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:18px 20px;box-shadow:var(--shadow-sm);transition:.15s;}
  .stat:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .stat .num{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.5px;}
  .stat.warn .num{color:var(--rose);}
  .stat .lbl{font-size:12.5px;color:var(--ink-soft);margin-top:6px;font-weight:500;}
  h2.section-title{font-size:15px;font-weight:700;margin:28px 0 12px;color:var(--ink);}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:340px;}
  th{text-align:right;font-size:11.5px;color:var(--ink-faint);font-weight:700;padding:6px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
  td{padding:11px 10px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .btn{
    font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
    border-radius:10px;padding:9px 16px;border:1px solid transparent;
    background:var(--primary-grad);color:#fff;transition:.15s;box-shadow:var(--shadow-sm);
  }
  .btn:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);filter:brightness(1.04);}
  .btn:active{transform:translateY(0);}
  .btn.secondary{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:none;}
  .btn.secondary:hover{background:var(--bg);box-shadow:var(--shadow-sm);}
  .btn.danger{background:var(--card);color:var(--rose);border-color:var(--rose-bg);box-shadow:none;}
  .btn.danger:hover{background:var(--rose-bg);box-shadow:var(--shadow-sm);}
  .btn.small{padding:6px 12px;font-size:12.5px;border-radius:8px;}
  input,select{
    font-family:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg);color:var(--ink);width:100%;transition:.15s;
  }
  input:focus,select:focus{outline:none;border-color:var(--primary);background:var(--card);box-shadow:0 0 0 3px var(--primary-bg);}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-left:38px;}
  .pw-toggle{position:absolute;left:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ink-faint);padding:6px;border-radius:6px;display:flex;}
  .pw-toggle:hover{color:var(--ink-soft);background:var(--bg);}
  .theme-toggle{
    width:36px;height:36px;border-radius:10px;flex-shrink:0;
    background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink-soft);box-shadow:var(--shadow-sm);transition:.15s;
  }
  .theme-toggle:hover{color:var(--primary);border-color:var(--primary);transform:translateY(-1px);box-shadow:var(--shadow-md);}

  /* Sidebar layout */
  .hamburger-btn{
    width:36px;height:36px;border-radius:10px;flex-shrink:0;
    background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink-soft);box-shadow:var(--shadow-sm);transition:.15s;
  }
  .hamburger-btn:hover{color:var(--primary);border-color:var(--primary);}
  .shell{display:flex;width:100%;height:100vh;min-height:100vh;align-items:stretch;overflow:hidden;}
  .sidebar{
    width:250px;flex-shrink:0;background:var(--card);border-left:1px solid var(--line);
    display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:hidden;
    transition:transform .25s cubic-bezier(.4,0,.2,1);
  }
  .sidebar-logo{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;}
  .sidebar-logo h1{font-size:16.5px;font-weight:800;margin:0;letter-spacing:-.2px;}
  .sidebar-logo span{font-size:11px;color:var(--ink-faint);}
  .side-nav-item{
    display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;border:none;
    background:none;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;
    color:var(--ink-soft);text-align:right;width:100%;margin-bottom:2px;
    transition:background-color .15s, color .15s, box-shadow .15s;
  }
  .side-nav-item:hover{background:var(--bg);color:var(--ink);}
  .side-nav-item.active{background:var(--primary-bg) !important;color:var(--primary) !important;font-weight:800 !important;box-shadow:inset 3px 0 0 0 var(--primary) !important;}
  .side-nav-item.active:hover{background:var(--primary-bg) !important;}
  .side-nav-section{font-size:10.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.5px;margin:16px 12px 6px;}
  .sidebar-bottom{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);}
  .sidebar-user{
    display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);font-weight:600;
    padding:0 8px 18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .sidebar-user-dot{width:9px;height:9px;border-radius:50%;background:#22c55e;flex-shrink:0;box-shadow:0 0 0 3px rgba(34,197,94,.14);position:relative;animation:onlinePulse 1.8s ease-in-out infinite;} .sidebar-user-dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(34,197,94,.28);animation:onlineRing 1.8s ease-out infinite;} @keyframes onlinePulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(.88);opacity:.78;}} @keyframes onlineRing{0%{transform:scale(.55);opacity:.8;}70%,100%{transform:scale(1.45);opacity:0;}}
  .main-area{flex:1;min-width:0;width:100%;height:100vh;box-sizing:border-box;margin:0 auto;padding:26px 28px 90px;overflow:auto;overflow-x:hidden;overscroll-behavior:none;}
  .main-topbar{display:none;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .sidebar-backdrop{
    display:none;position:fixed;inset:0;background:rgba(10,10,20,.4);z-index:70;
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  @media(max-width:900px){
    .sidebar{position:fixed;top:0;right:0;bottom:0;transform:translateX(100%);z-index:80;box-shadow:var(--shadow-lg);}
    .sidebar.open{transform:translateX(0);}
    .main-area{padding:0 16px 90px;}
    .main-topbar{
      display:flex;position:sticky;top:0;z-index:60;
      margin:0 -16px 18px;padding-top:14px;padding-bottom:14px;
      background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }
    .sidebar-backdrop{display:block;}
    .sidebar-backdrop.open{opacity:1;pointer-events:auto;}
  }
  @media(max-width:480px){
    .main-area{padding:14px 12px 90px;}
    .card{padding:16px 14px;}
    .stat .num{font-size:22px;}
  }


  @font-face{font-family:"B Titr";src:local("B Titr"),local("BTitr"),url("https://raw.githubusercontent.com/artbijan/Web-Font/master/BTitrBold.woff2") format("woff2"),url("https://raw.githubusercontent.com/artbijan/Web-Font/master/BTitrBold.woff") format("woff"),url("https://raw.githubusercontent.com/artbijan/Web-Font/master/B%20Titr.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:"B Yekan";src:local("B Yekan"),local("BYekan"),local("Yekan"),url("https://raw.githubusercontent.com/DediData/Yekan-Font/master/Yekan.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap;}
  /* Certificate maker */
  .cert-layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start;}
  .cert-settings-panel{max-height:calc(100vh - 120px);height:auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;min-height:0;}
  @media(max-width:860px){.cert-layout{grid-template-columns:1fr;}.cert-settings-panel{max-height:none;height:auto;overflow:visible;}.cert-preview-wrap{min-height:0;}}
  .cert-preview-wrap{
    background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(8px,2vw,20px);
    display:flex;align-items:flex-start;justify-content:center;min-width:0;width:100%;max-width:100%;overflow:auto;
  }
  /* The page is drawn at a fixed design size and scaled to fit, so what you see is exactly what gets exported */
  .cert-scale-wrap{position:relative;flex:0 0 auto;margin:0 auto;}
  .cert-page{
    position:absolute;top:0;left:0;transform-origin:top left;box-sizing:border-box;flex-shrink:0;
    background-color:var(--cert-bg,#FFFDF7);
    background-image:radial-gradient(circle at 100% 0,var(--cert-tint,rgba(184,134,11,.10)) 0,var(--cert-tint0,rgba(184,134,11,0)) 46%),radial-gradient(circle at 0 100%,var(--cert-tint,rgba(184,134,11,.10)) 0,var(--cert-tint0,rgba(184,134,11,0)) 46%);
    box-shadow:0 10px 30px rgba(0,0,0,.12);color:#2A2416;direction:rtl;overflow:hidden;text-align:center;
  }
  .cert-watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.07;z-index:0;pointer-events:none;}
  .cert-wm-img{width:320px;height:320px;background-repeat:no-repeat;background-position:center;background-size:contain;}

  /* Default logo: the letter «د» inside a ringed circle */
  .cert-mark{
    --m:60px;width:var(--m);height:var(--m);flex:0 0 auto;box-sizing:border-box;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--cert-border,#B8860B);background:rgba(255,255,255,.75);color:var(--cert-accent,#8B6508);
    box-shadow:0 0 0 3px var(--cert-bg,#FFFDF7),0 0 0 4.5px var(--cert-soft,rgba(184,134,11,.35));
    font-family:"Vazirmatn",Tahoma,sans-serif;font-weight:800;line-height:1;font-size:calc(var(--m) * .56);
  }
  .cert-mark span{display:block;position:relative;top:-.07em;}
  .cert-mark.wm{--m:300px;border-width:9px;background:transparent;box-shadow:0 0 0 14px var(--cert-bg,#FFFDF7),0 0 0 19px var(--cert-border,#B8860B);}

  /* Modern border: thin outline, heavy rounded corner brackets and a quiet inner keyline */
  .cert-border{position:absolute;inset:16px;border:1.5px solid var(--cert-border,#B8860B);border-radius:22px;z-index:1;pointer-events:none;}
  .cert-corner{position:absolute;display:block;width:68px;height:68px;border:0 solid var(--cert-border,#B8860B);}
  .cert-corner.tl{top:-2px;left:-2px;border-top-width:6px;border-left-width:6px;border-top-left-radius:22px;}
  .cert-corner.tr{top:-2px;right:-2px;border-top-width:6px;border-right-width:6px;border-top-right-radius:22px;}
  .cert-corner.bl{bottom:-2px;left:-2px;border-bottom-width:6px;border-left-width:6px;border-bottom-left-radius:22px;}
  .cert-corner.br{bottom:-2px;right:-2px;border-bottom-width:6px;border-right-width:6px;border-bottom-right-radius:22px;}
  .cert-border-inner{position:absolute;inset:30px;border:1px solid var(--cert-soft,rgba(184,134,11,.35));border-radius:14px;z-index:1;pointer-events:none;}

  .cert-number{
    position:absolute;top:44px;right:54px;background:rgba(255,255,255,.85);
    border:1px solid var(--cert-border,#B8860B);color:var(--cert-accent,#8B6508);
    font-weight:700;font-size:12px;padding:4px 12px;border-radius:20px;z-index:3;direction:ltr;
  }
  .cert-frame{
    position:absolute;inset:46px;padding:22px 20px;z-index:2;box-sizing:border-box;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  }
  .cert-head,.cert-main{display:flex;flex-direction:column;align-items:center;width:100%;}
  .cert-main{margin-top:16px;}
  .cert-foot{margin-top:auto;padding-top:26px;}
  .cert-head .cert-mark{margin-bottom:12px;}
  .cert-logo{width:60px;height:60px;object-fit:contain;margin-bottom:10px;}
  .cert-schoolname{font-weight:700;color:#4a4330;margin-bottom:2px;}
  .cert-title{font-family:"B Titr",serif;font-weight:700;color:var(--cert-accent,#8B6508);letter-spacing:0;direction:rtl;unicode-bidi:plaintext;white-space:nowrap;}
  .cert-divider{display:flex;align-items:center;gap:10px;margin:12px 0 2px;}
  .cert-divider::before,.cert-divider::after{content:"";display:block;width:64px;height:1.5px;background:var(--cert-border,#B8860B);opacity:.5;}
  .cert-divider i{display:block;width:7px;height:7px;background:var(--cert-border,#B8860B);transform:rotate(45deg);}
  .cert-sub{font-size:14px;color:#6b6248;margin:0 0 6px;}
  .cert-name{font-family:"Vazirmatn",Tahoma,sans-serif;font-weight:normal;direction:rtl;unicode-bidi:plaintext;color:#2A2416;margin:0 0 16px;border-bottom:2px solid var(--cert-accent,#8B6508);padding:0 28px 8px;min-width:50%;box-sizing:border-box;}
  .cert-body{line-height:2;max-width:88%;color:#3d3624;}
  .cert-foot{display:flex;justify-content:space-between;align-items:flex-end;width:100%;font-size:13px;color:#4a4330;}
  .cert-sign{min-width:150px;text-align:center;}
  .cert-sign .sign-name{min-height:1.7em;font-weight:600;}
  .cert-sign .sig-line{margin-top:4px;padding-top:6px;border-top:1px solid var(--cert-soft,rgba(184,134,11,.35));font-size:.85em;color:#6b6248;}

  /* Portrait: same design language, more room to breathe */
  .cert-page.is-portrait .cert-head .cert-mark{--m:84px;margin-bottom:16px;}
  .cert-page.is-portrait .cert-logo{width:84px;height:84px;margin-bottom:14px;}
  .cert-page.is-portrait .cert-frame{padding:40px 26px 30px;}
  .cert-page.is-portrait .cert-body{max-width:92%;}
  .cert-page.is-portrait .cert-number{right:50px;}
  .cert-page.is-portrait .cert-sign{min-width:130px;}

  /* Logo upload */
  .logo-field{position:relative;display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .logo-current{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);}
  .logo-thumb{width:48px;height:48px;flex:0 0 48px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .logo-thumb img{width:100%;height:100%;object-fit:contain;display:block;}
  .logo-thumb.is-default{border:2px solid var(--primary);color:var(--primary);font-size:24px;font-weight:800;line-height:1;box-shadow:0 0 0 3px var(--card),0 0 0 4.5px var(--line);}
  .logo-thumb.is-default span{position:relative;top:-2px;}
  .logo-meta{min-width:0;flex:1;}
  .logo-meta b{display:block;font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .logo-meta span{display:block;font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
  .logo-drop{
    display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:18px 14px;cursor:pointer;
    border:1.5px dashed color-mix(in srgb,var(--primary) 38%,var(--line));border-radius:16px;
    background:color-mix(in srgb,var(--primary-bg) 55%,transparent);transition:border-color .15s,background .15s,transform .15s;
  }
  .logo-drop:hover,.logo-drop.dragover{border-color:var(--primary);background:var(--primary-bg);}
  .logo-drop.dragover{transform:scale(1.015);}
  .logo-drop-icon{width:40px;height:40px;border-radius:12px;background:var(--card);color:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);}
  .logo-drop strong{font-size:13px;font-weight:700;color:var(--ink);}

function animateIn(el, className){
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ el.classList.add(className); }); });
}
function closeSidebarThenRender(afterFn){
  const aside = document.querySelector('.sidebar');
  const backdrop = document.querySelector('.sidebar-backdrop');
  if(sidebarOpen && aside && window.innerWidth<=900){
    aside.classList.remove('open');
    if(backdrop) backdrop.classList.remove('open');
    sidebarOpen = false;
    setTimeout(afterFn, 260); // matches the CSS transition duration
  }else{
    sidebarOpen = false;
    afterFn();
  }
}
function goToTab(tab){
  closeSidebarThenRender(()=>{
    activeTab = tab;

    if(tab==='exam' && !examBuilder) initExamBuilder();
    render();
  });
}

// --- Jalali (Persian/Shamsi) calendar helpers ---
const JALALI_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function faDigits(n){ return Number(n).toLocaleString('fa-IR', {useGrouping:false}); }
function gregorianToJalali(gy, gm, gd){
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) - 80 + gd + g_d_m[gm-1];
  jy += 33 * Math.floor(days/12053);
  days %= 12053;
  jy += 4 * Math.floor(days/1461);
  days %= 1461;
  if (days > 365) { jy += Math.floor((days-1)/365); days = (days-1) % 365; }
  let jm, jd;
  if (days < 186) { jm = 1 + Math.floor(days/31); jd = 1 + (days%31); }
  else { jm = 7 + Math.floor((days-186)/30); jd = 1 + ((days-186)%30); }
  return [jy, jm, jd];
}
function todayJalali(){
  const now = new Date();
  return gregorianToJalali(now.getFullYear(), now.getMonth()+1, now.getDate());
}
function daysInJalaliMonth(jm){ return jm<=6 ? 31 : 30; } // esfand treated as 30 for simplicity
function jalaliLabel(jy,jm,jd){ return `${faDigits(jy)} ${JALALI_MONTHS[jm-1]} ${faDigits(jd)}`; }
function jalaliSortKey(jy,jm,jd){ return jy*10000 + jm*100 + jd; }

function initCertState(){
  const [jy,jm,jd] = todayJalali();
  cert = {
    studentId: state.roster.length? state.roster[0].id : '__free__',
    freeName: '',
    schoolName: '',
    logoDataUrl: null,
    logoName: '',
    logoSize: 0,
    certNumber: '',
    title: 'لوح تقدیر',
    body: defaultCertBody(state.roster.length? state.roster[0].name : '', ''),
    course: '',
    signer: currentUser ? currentUser.displayName : '',
    jy, jm, jd,
    theme: 'gold',
    orientation: 'landscape',
    sizes: { title:32, subtitle:14, name:38, body:14 }
  };
}
function certStudentName(){
  if(cert.studentId==='__free__') return cert.freeName.trim();
  const r = state.roster.find(x=>x.id===cert.studentId);
  return r ? r.name : '';
}

function getAttendance(session, sid){
  const a = session.attendance[sid];
  if(!a) return {status:null, note:''};
  if(typeof a === 'string') return {status:a, note:''}; // backward compatibility with older records
  return {status:a.status||null, note:a.note||''};
}
function setAttendanceStatus(session, sid, status){
  const cur = getAttendance(session, sid);
  session.attendance[sid] = {status, note:cur.note};
}
function setAttendanceNote(session, sid, note){
  const cur = getAttendance(session, sid);
  session.attendance[sid] = {status:cur.status, note};
}
function buildAttendanceShareText(cls, session){
  const ids = cls.studentIds||[];
  const present = [], absent = [];
  ids.forEach(sid=>{
    const student = state.roster.find(r=>r.id===sid);
    if(!student) return;
    const a = getAttendance(session, sid);
    const line = a.note ? `${student.name} (${a.note})` : student.name;
    if(a.status==='absent') absent.push(line); else present.push(line);
  });
  let text = `📋 حضور و غیاب کلاس «${cls.name}»\n📅 تاریخ: ${session.label}\n\n`;
  text += `✅ حاضر (${present.length.toLocaleString('fa-IR')} نفر):\n`;
  text += present.length ? present.map(n=>'- '+n).join('\n') : '(کسی حاضر نبود)';
  text += `\n\n❌ غایب (${absent.length.toLocaleString('fa-IR')} نفر):\n`;
  text += absent.length ? absent.map(n=>'- '+n).join('\n') : '(غایبی نداشتیم)';
  return text;
}
async function shareSession(cls, session){
  const text = buildAttendanceShareText(cls, session);
  if(navigator.share){
    try{ await navigator.share({title:'حضور و غیاب '+cls.name, text}); return; }
    catch(e){ /* user cancelled or unsupported — fall through to clipboard */ }
  }
  try{
    await navigator.clipboard.writeText(text);
    alert('متن حضور و غیاب کپی شد. حالا می‌توانید آن را در تلگرام، واتس‌اپ یا هر جای دیگری پیست کنید.');
  }catch(e){
    alert(text);
  }
}

function friendlySupabaseError(msg){
  if(!msg) return 'خطای غیرمنتظره‌ای رخ داد. دوباره تلاش کنید.';
  if(/already registered|already exists/i.test(msg)) return 'این ایمیل قبلاً ثبت شده است.';
  if(/invalid login credentials/i.test(msg)) return 'ایمیل یا رمز عبور اشتباه است.';
  if(/password should be at least/i.test(msg)) return 'رمز عبور باید حداقل ۶ کاراکتر باشد.';
  if(/unable to validate email|invalid email/i.test(msg)) return 'ایمیل معتبر نیست.';
  if(/email not confirmed/i.test(msg)) return 'ابتدا باید ایمیل خود را تایید کنید (ایمیل تاییدیه را چک کنید).';
  if(/failed to fetch|network/i.test(msg)) return 'اتصال به سرور برقرار نشد. اینترنت را بررسی کنید.';
  return msg;
}

async function loadData(){
  try{
    const { data, error } = await sb.from('tutor_data').select('data').eq('user_id', currentUser.id).maybeSingle();
    if(error) throw error;
    state = (data && data.data) ? data.data : {students:[]};
  }catch(e){
    console.error('خطا در بارگذاری اطلاعات', e);
    state = {students:[]};
  }
  if(!Array.isArray(state.students)) state.students = [];
  if(!Array.isArray(state.roster)) state.roster = [];
  if(!Array.isArray(state.classes)) state.classes = [];
  if(state.theme==='dark' || state.theme==='light'){ theme = state.theme; }
}
async function saveData(){
  try{
    const { error } = await sb.from('tutor_data').upsert({
      user_id: currentUser.id,
      data: state,
      updated_at: new Date().toISOString()
    });
    if(error) throw error;
  }catch(e){
    console.error('خطا در ذخیره‌سازی', e);
    alert('ذخیره‌سازی خودکار با مشکل مواجه شد. لطفاً اتصال اینترنت را بررسی کنید و دوباره امتحان کنید.');
  }
}

function setAuthenticatedUser(user, displayNameOverride=''){
  if(!user) return false;
  currentUser = {
    id:user.id,
    email:user.email,
    displayName: displayNameOverride || (user.user_metadata && user.user_metadata.display_name) || user.email
  };
  state = {students:[], roster:[], classes:[], theme};
  return true;
}

function removeInitialLoading(){
  const loading=document.querySelector('.loading-screen');
  if(!loading) return;
  loading.style.opacity='0';
  loading.style.pointerEvents='none';
  setTimeout(()=>loading.remove(),240);
}

function renderAuthenticatedNow(){
  try{
    render();
    return true;
  }catch(e){
    console.error('خطا در رندر داشبورد:',e);
    // حتی اگر یک بخش فرعی خطا داد، صفحه ورود باقی نماند.
    if(currentUser){
      try{
        $app.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);direction:rtl;"><div class="card" style="max-width:460px;text-align:center;"><div style="font-size:18px;font-weight:800;margin-bottom:8px;color:var(--ink);">ورود با موفقیت انجام شد</div><div style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">داشبورد در حال آماده‌سازی است...</div><button class="btn" type="button" onclick="location.reload()">تلاش دوباره</button></div></div>`;
        return false;
      }catch(_){ return false; }
    }
    return false;
  }
}

async function enterDashboard(user, displayNameOverride='', keepLoading=false){
  if(!setAuthenticatedUser(user,displayNameOverride)) return false;
  if(!keepLoading) hideAuthLoading();
  removeInitialLoading();
  // اول خود داشبورد را نشان بده؛ دریافت اطلاعات نباید مانع ورود کاربر شود.
  renderAuthenticatedNow();
  // سپس اطلاعات ذخیره‌شده را در پس‌زمینه دریافت کن و فقط در صورت موفقیت/اتمام، محتوا را تازه کن.
  setTimeout(async ()=>{
    const id=currentUser && currentUser.id;
    await loadDashboardDataSafely(8000);
    if(currentUser && currentUser.id===id) renderAuthenticatedNow();
  },0);
  authBusy=false;
  return true;
}

async function doSignup(displayName, email, password, confirm){
  authErrors = {}; authNotice = '';
  const name = displayName.trim();
  const mail = email.trim().toLowerCase();
  if(!name) authErrors.name = 'نام و نام خانوادگی را وارد کنید.';
  if(!mail) authErrors.email = 'ایمیل را وارد کنید.';
  else if(!isEmailValid(mail)) authErrors.email = 'ایمیل معتبر نیست.';
  if(password.length<6) authErrors.password = 'رمز عبور باید حداقل ۶ کاراکتر باشد.';
  else if(password!==confirm) authErrors.confirm = 'تکرار رمز عبور مطابقت ندارد.';
  if(Object.keys(authErrors).length) return false;

  try{
    const { data, error } = await sb.auth.signUp({
      email: mail,
      password,
      options: { data: { display_name: name } }
    });
    if(error){ authErrors.general = friendlySupabaseError(error.message); return false; }
    if(data.session && data.user){
      await enterDashboard(data.user,name);
      saveData().catch(e=>console.error('خطا در ذخیره اطلاعات اولیه حساب',e));
      return true;
    }
    authNotice = 'یک ایمیل تایید برایتان ارسال شد. لطفاً صندوق ورودی‌تان را چک کنید، لینک را بزنید، سپس از تب «ورود» وارد شوید.';
    authView = 'login';
    return false;
  }catch(e){
    console.error(e);
    authErrors.general = friendlySupabaseError(e.message);
    return false;
  }
}

async function doLogin(email, password){
  authErrors = {}; authNotice = '';
  const mail = email.trim().toLowerCase();
  if(!mail){ authErrors.email='ایمیل را وارد کنید.'; return false; }
  if(!password){ authErrors.password='رمز عبور را وارد کنید.'; return false; }
  try{
    const { data, error } = await Promise.race([
      sb.auth.signInWithPassword({ email:mail, password }),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error('login_timeout')),12000))
    ]);
    if(error){ authErrors.general = friendlySupabaseError(error.message); return false; }
    if(!data || !data.user){ authErrors.general='ورود انجام نشد. دوباره تلاش کنید.'; return false; }
    await enterDashboard(data.user);
    return true;
  }catch(e){
    console.error(e);
    authErrors.general = e && e.message==='login_timeout'
      ? 'ارتباط با سرور بیش از حد طول کشید. اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.'
      : friendlySupabaseError(e.message);
    return false;
  }
}

async function sendPasswordReset(email){
  authErrors = {}; authNotice = '';
  const mail = email.trim().toLowerCase();
  if(!mail){ authErrors.email='ایمیل را وارد کنید.'; return false; }
  if(!isEmailValid(mail)){ authErrors.email='ایمیل معتبر نیست.'; return false; }
  try{
    const { error } = await Promise.race([
      sb.auth.resetPasswordForEmail(mail, { redirectTo: DANIA_AUTH_REDIRECT_URL }),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error('reset_timeout')),12000))
    ]);
    if(error){ authErrors.general = friendlySupabaseError(error.message); return false; }
    authNotice = 'اگر این ایمیل در دانیا ثبت شده باشد، لینک تغییر رمز عبور برایتان ارسال می‌شود. صندوق ورودی و پوشه هرزنامه را بررسی کنید.';
    return true;
  }catch(e){
    console.error(e);
    authErrors.general = e && e.message==='reset_timeout'
      ? 'ارتباط با سرور بیش از حد طول کشید. اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.'
      : friendlySupabaseError(e.message);
    return false;
  }
}

async function updatePassword(newPassword, confirmPassword){
  authErrors = {}; authNotice = '';
  if(!newPassword){ authErrors.password='رمز عبور جدید را وارد کنید.'; return false; }
  if(newPassword.length < 6){ authErrors.password='رمز عبور باید حداقل ۶ کاراکتر باشد.'; return false; }
  if(newPassword !== confirmPassword){ authErrors.confirm='تکرار رمز عبور مطابقت ندارد.'; return false; }
  try{
    const { data, error } = await Promise.race([
      sb.auth.updateUser({ password:newPassword }),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error('update_password_timeout')),12000))
    ]);
    if(error){ authErrors.general = friendlySupabaseError(error.message); return false; }
    if(!data || !data.user){ authErrors.general='تغییر رمز عبور انجام نشد. دوباره تلاش کنید.'; return false; }
    return true;
  }catch(e){
    console.error(e);
    authErrors.general = e && e.message==='update_password_timeout'
      ? 'ارتباط با سرور بیش از حد طول کشید. دوباره تلاش کنید.'
      : friendlySupabaseError(e.message);
    return false;
  }
}

async function doLogout(){
  showAuthLoading('در حال خروج از حساب...');
  try{ await sb.auth.signOut(); }catch(e){ console.error(e); }
  ++authBusyToken;
  currentUser = null;
  state = {students:[]};
  activeTab='dashboard';
  activeStudentId=null;
  authView='login';
  authErrors={};
  authNotice='';
  render();
  hideAuthLoading();
}

async function loadDashboardDataSafely(timeoutMs=8000){
  if(!currentUser) return;
  try{
    await Promise.race([
      loadData(),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error('dashboard_data_timeout')),timeoutMs))
    ]);
  }catch(e){
    console.warn('بارگذاری اطلاعات داشبورد طول کشید؛ داشبورد بدون انتظار بیشتر نمایش داده می‌شود.', e);
    if(!Array.isArray(state.students))state.students=[];
    if(!Array.isArray(state.roster))state.roster=[];
    if(!Array.isArray(state.classes))state.classes=[];
  }
}

async function restoreSession(){
  try{
    const { data } = await sb.auth.getSession();
    const recovery = /(?:^|[&#?])type=recovery(?:&|$)/i.test(location.hash + '&' + location.search);
    if(recovery || authView === 'reset'){
      authView='reset';
      currentUser=null;
      authBusy=false;
      removeInitialLoading();
      render();
      return;
    }
    if(data.session && data.session.user){
      await enterDashboard(data.session.user,'',true);
    }else{
      authBusy=false;
      removeInitialLoading();
      render();
    }
  }catch(e){
    console.error('خطا در بازیابی نشست:',e);
    authBusy=false;
    removeInitialLoading();
    render();
  }
}

// دریافت رویداد PASSWORD_RECOVERY باعث می‌شود حتی اگر Supabase کمی دیرتر نشست را آماده کند،
// فرم تعیین رمز جدید بلافاصله نمایش داده شود.
sb.auth.onAuthStateChange((event, session)=>{
  if(event === 'PASSWORD_RECOVERY'){
    authView='reset'; currentUser=null; authBusy=false;
    hideAuthLoading(); removeInitialLoading(); render(); return;
  }
  if(event === 'SIGNED_IN' && IS_PASSWORD_RECOVERY){
    authView='reset'; currentUser=null; authBusy=false;
    hideAuthLoading(); removeInitialLoading(); render();
  }
});

function termPaid(term){ return term.payments.reduce((s,p)=>s+Number(p.amount||0),0); }
function termRemaining(term){ return Math.max(0, Number(term.totalAmount||0) - termPaid(term)); }
function studentBalance(st){
  return st.terms.reduce((s,t)=>s+termRemaining(t),0);
}

function render(){
  applyTheme();
  if(!currentUser){ $app.innerHTML=''; renderAuth($app); return; }

  let shell = $app.querySelector('.shell');
  if(!shell){
    $app.innerHTML=''; // پاک‌سازی هر محتوای قبلی (مثلاً فرم ورود) قبل از ساخت داشبورد
    shell = document.createElement('div'); shell.className='shell';
    const backdrop = document.createElement('div');
    backdrop.className='sidebar-backdrop';
    if(sidebarOpen) animateIn(backdrop,'open');
    backdrop.onclick=()=>closeSidebarThenRender(render);
    shell.appendChild(backdrop);
    shell.appendChild(renderSidebar());

    const mainArea=document.createElement('div'); mainArea.className='main-area';
    const topbar=document.createElement('div'); topbar.className='main-topbar';
    const mobileToggle=document.createElement('button'); mobileToggle.className='hamburger-btn'; mobileToggle.title='منو';
    mobileToggle.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>`;
    mobileToggle.onclick=()=>{
      sidebarOpen=true;
      const aside=document.querySelector('.sidebar');
      const backdrop=document.querySelector('.sidebar-backdrop');
      if(aside) aside.classList.add('open');
      if(backdrop) backdrop.classList.add('open');
    };
    const currentLabel=[...NAV_ITEMS,...SERVICE_NAV_ITEMS].find(i=>i.tab===activeTab);
    const label=document.createElement('div'); label.className='topbar-label'; label.style.cssText='font-weight:800;font-size:16px;'; label.textContent=currentLabel?currentLabel.label:'';
    const topbarActions=document.createElement('div'); topbarActions.style.cssText='display:flex;align-items:center;gap:8px;direction:rtl;';
    const topbarIcon=document.createElement('span'); topbarIcon.className='topbar-section-icon'; topbarIcon.textContent=currentLabel?.icon||''; topbarIcon.setAttribute('aria-hidden','true');
    topbarActions.appendChild(mobileToggle);
    topbarActions.appendChild(topbarIcon);
    topbar.appendChild(label); topbar.appendChild(topbarActions); mainArea.appendChild(topbar);
    const content=document.createElement('div'); content.id='main-content'; mainArea.appendChild(content);
    shell.appendChild(mainArea); $app.appendChild(shell);
  }

  const label=[...NAV_ITEMS,...SERVICE_NAV_ITEMS].find(i=>i.tab===activeTab);
  const topLabel=shell.querySelector('.topbar-label'); if(topLabel) topLabel.textContent=label?label.label:'';
  shell.querySelectorAll('.side-nav-item').forEach(btn=>btn.classList.toggle('active', btn.dataset.tab===activeTab));
  const content=shell.querySelector('#main-content');
  content.innerHTML='';
  if(activeTab==='dashboard') renderDashboard(content);
  else if(activeTab==='private'){ if(activeStudentId) renderStudentDetail(content); else renderStudentsList(content); }
  else if(activeTab==='classes'){ if(activeClassId) renderClassDetail(content); else renderClassesList(content); }
  else if(activeTab==='certificate') renderCertificateScreen(content);
  else if(activeTab==='exam') renderExamBuilderScreen(content);

  const oldModal=$app.querySelector('.modal-bg'); if(oldModal) oldModal.remove();
  if(modal) renderModal();
}

function showAuthLoading(message='در حال ورود به دانیا...'){
  let overlay=document.querySelector('.auth-loading-overlay');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.className='auth-loading-overlay';
    overlay.innerHTML=`<div class="auth-loading-box" role="status" aria-live="polite">
      <div class="auth-loading-spinner" aria-hidden="true"></div>
      <div class="auth-loading-text" data-auth-loading-text>${escapeHtml(message)}</div>
    </div>`;
    document.body.appendChild(overlay);
  }else{
    const t=overlay.querySelector('[data-auth-loading-text]'); if(t) t.textContent=message;
  }
  requestAnimationFrame(()=>overlay.classList.add('is-visible'));
}
function hideAuthLoading(){
  const overlay=document.querySelector('.auth-loading-overlay');
  if(!overlay)return;
  overlay.classList.remove('is-visible');
  setTimeout(()=>overlay.remove(),220);
}

  box.querySelector('#tab-login').onclick=()=>{ authView='login'; authErrors={}; authNotice=''; render(); };
  box.querySelector('#tab-signup').onclick=()=>{ authView='signup'; authErrors={}; authNotice=''; render(); };

  const authCard = box.querySelector('#auth-card');
  const errHtml = (field)=> authErrors[field] ? `<div style="color:var(--rose);font-size:12px;margin:-6px 0 12px;">${escapeHtml(authErrors[field])}</div>` : '';
  const noticeHtml = authNotice ? `<div style="background:var(--emerald-bg);color:var(--emerald);font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:14px;">${escapeHtml(authNotice)}</div>` : '';

  if(authView==='login'){
    authCard.innerHTML = `
      ${noticeHtml}
      <div class="field"><label>ایمیل</label><input id="l-email" type="email" autocomplete="email"></div>
      ${errHtml('email')}
      ${pwField('l-password','رمز عبور','current-password')}
      ${errHtml('password')}
      <div style="display:flex;justify-content:flex-start;margin:-2px 0 14px;"><button type="button" id="forgot-password" style="border:0;background:none;padding:5px 7px;color:var(--primary);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;">رمز عبور را فراموش کرده‌اید؟</button></div>
      ${authErrors.general? `<div style="color:var(--rose);font-size:13px;margin-bottom:10px;">${escapeHtml(authErrors.general)}</div>`:''}
      <button class="btn" id="do-login" style="width:100%;">ورود</button>
    `;
    wirePwToggles(authCard);
    const submit = async ()=>{
      if(authBusy)return;
      const em = authCard.querySelector('#l-email').value;
      const p = authCard.querySelector('#l-password').value;
      authBusy=true;
      const token=++authBusyToken;
      showAuthLoading('در حال ورود به دانیا...');
      try{
        const ok = await doLogin(em,p);
        if(token!==authBusyToken)return;
        if(!ok){
          authBusy=false;
          hideAuthLoading();
          render();
          return;
        }
        // doLogin خودش بلافاصله داشبورد را نمایش می‌دهد.
      }catch(e){
        console.error(e);
        if(token===authBusyToken){
          authBusy=false;
          hideAuthLoading();
          authErrors={general:'خطای غیرمنتظره‌ای رخ داد. دوباره تلاش کنید.'};
          render();
        }
      }
    };
    authCard.querySelector('#do-login').onclick=submit;
    authCard.querySelector('#forgot-password').onclick=()=>{ authView='forgot'; authErrors={}; authNotice=''; render(); };
    authCard.querySelectorAll('input').forEach(inp=>inp.onkeydown=(e)=>{ if(e.key==='Enter') submit(); });
  }else if(authView==='forgot'){
    authCard.innerHTML = `
      <div style="font-size:18px;font-weight:800;margin-bottom:7px;">بازیابی رمز عبور</div>
      <div style="font-size:12.5px;color:var(--ink-soft);line-height:1.8;margin-bottom:16px;">ایمیل حساب خود را وارد کنید تا لینک تغییر رمز برایتان ارسال شود.</div>
      ${noticeHtml}
      <div class="field"><label>ایمیل</label><input id="r-email" type="email" autocomplete="email" placeholder="example@email.com"></div>
      ${errHtml('email')}
      ${authErrors.general? `<div style="color:var(--rose);font-size:13px;margin-bottom:10px;">${escapeHtml(authErrors.general)}</div>`:''}
      <button class="btn" id="do-reset" style="width:100%;">ارسال لینک بازیابی</button>
      <button type="button" id="back-login" style="width:100%;margin-top:10px;border:0;background:none;color:var(--ink-soft);font:inherit;font-size:12.5px;cursor:pointer;">← بازگشت به ورود</button>
    `;
    const submitReset = async ()=>{
      if(authBusy)return;
      const em=authCard.querySelector('#r-email').value;
      authBusy=true;
      const token=++authBusyToken;
      showAuthLoading('در حال ارسال لینک بازیابی...');
      try{
        const ok=await sendPasswordReset(em);
        if(token!==authBusyToken)return;
        authBusy=false;
        hideAuthLoading();
        if(ok){ authCard.querySelector('#r-email').value=''; }
        render();
      }catch(e){
        console.error(e);
        if(token===authBusyToken){ authBusy=false; hideAuthLoading(); authErrors={general:'خطای غیرمنتظره‌ای رخ داد. دوباره تلاش کنید.'}; render(); }
      }
    };
    authCard.querySelector('#do-reset').onclick=submitReset;
    authCard.querySelector('#back-login').onclick=()=>{ authView='login'; authErrors={}; authNotice=''; render(); };
    authCard.querySelector('#r-email').onkeydown=(e)=>{ if(e.key==='Enter') submitReset(); };
  }else if(authView==='reset'){
    authCard.innerHTML = `
      <div style="font-size:18px;font-weight:800;margin-bottom:7px;">تغییر رمز عبور</div>
      <div style="font-size:12.5px;color:var(--ink-soft);line-height:1.8;margin-bottom:16px;">رمز عبور جدید خود را وارد کنید. رمز باید حداقل ۶ کاراکتر باشد.</div>
      ${authErrors.general? `<div style="color:var(--rose);font-size:13px;margin-bottom:10px;">${escapeHtml(authErrors.general)}</div>`:''}
      ${pwField('rp-password','رمز عبور جدید','new-password')}
      ${errHtml('password')}
      ${pwField('rp-confirm','تکرار رمز عبور جدید','new-password')}
      ${errHtml('confirm')}
      <button class="btn" id="do-update-password" style="width:100%;">ذخیره رمز جدید</button>
    `;
    wirePwToggles(authCard);
    const submitUpdate=async()=>{
      if(authBusy)return;
      const p=authCard.querySelector('#rp-password').value;
      const c=authCard.querySelector('#rp-confirm').value;
      authBusy=true;
      const token=++authBusyToken;
      showAuthLoading('در حال تغییر رمز عبور...');
      try{
        const ok=await updatePassword(p,c);
        if(token!==authBusyToken)return;
        authBusy=false;
        hideAuthLoading();
        if(ok){

    };

    `;

      if(authBusy)return;
      const name = authCard.querySelector('#s-name').value;
      const email = authCard.querySelector('#s-email').value;
      const p = authCard.querySelector('#s-password').value;
      const c = authCard.querySelector('#s-confirm').value;
      authBusy=true;
      const token=++authBusyToken;
      showAuthLoading('در حال ساخت حساب دانیا...');
      try{
        const ok = await doSignup(name,email,p,c);
        if(token!==authBusyToken)return;
        if(!ok){
          authBusy=false;
          hideAuthLoading();
          render();
          return;
        }
        // doSignup در صورت ایجاد session خودش بلافاصله داشبورد را نمایش می‌دهد.
      }catch(e){
        console.error(e);
        if(token===authBusyToken){
          authBusy=false;
          hideAuthLoading();
          authErrors={general:'خطای غیرمنتظره‌ای رخ داد. دوباره تلاش کنید.'};
          render();
        }
      }
    };
    authCard.querySelector('#do-signup').onclick=submit;
    authCard.querySelectorAll('input').forEach(inp=>inp.onkeydown=(e)=>{ if(e.key==='Enter') submit(); });
  }
}

        div.innerHTML = ptable;

      addPayRow.className='row';
      addPayRow.style.marginTop='12px';
      addPayRow.innerHTML=`
        <div class="field"><label>تاریخ پرداخت</label><input type="text" placeholder="مثلاً ۱۴۰۴/۰۶/۰۱" data-pay-date="${term.id}"></div>
        <div class="field"><label>مبلغ (تومان)</label><input type="number" min="0" data-pay-amount="${term.id}"></div>
        <div class="field"><label>توضیح (اختیاری)</label><input type="text" data-pay-note="${term.id}"></div>
        <div class="field" style="flex:0 0 auto;display:flex;align-items:flex-end;"><button class="btn small" data-add-pay="${term.id}">ثبت پرداخت</button></div>
      `;
      block.appendChild(addPayRow);
      termsCard.appendChild(block);
    });

    termsCard.querySelectorAll('[data-del-term]').forEach(b=>{
      b.onclick=()=>{
        const tid=b.dataset.delTerm;
        st.terms = st.terms.filter(t=>t.id!==tid);
        saveData(); render();
      };
    });
    termsCard.querySelectorAll('[data-del-payment]').forEach(b=>{
      b.onclick=()=>{
        const [tid,pid]=b.dataset.delPayment.split('|');
        const term = st.terms.find(t=>t.id===tid);
        if(term) term.payments = term.payments.filter(p=>p.id!==pid);
        saveData(); render();
      };
    });
    termsCard.querySelectorAll('[data-add-pay]').forEach(b=>{
      b.onclick=()=>{
        const tid=b.dataset.addPay;
        const term = st.terms.find(t=>t.id===tid);
        const dateEl = termsCard.querySelector(`[data-pay-date="${tid}"]`);
        const amtEl = termsCard.querySelector(`[data-pay-amount="${tid}"]`);
        const noteEl = termsCard.querySelector(`[data-pay-note="${tid}"]`);
        const amount = Number(amtEl.value);
        if(!amount || amount<=0){ amtEl.style.borderColor='var(--rust)'; amtEl.focus(); return; }
        term.payments = term.payments||[];
        term.payments.push({id:uid(), date:dateEl.value||'-', amount, note:noteEl.value});
        saveData(); render();
      };
    });
  }
  root.appendChild(termsCard);
}

        <div class="s-detail"><span class="s-detail-icon">👥</span>${(cls.studentIds||[]).length.toLocaleString('fa-IR')} دانش‌آموز</div>
        <div class="s-detail"><span class="s-detail-icon">◷</span>${(cls.sessions||[]).length.toLocaleString('fa-IR')} جلسه ثبت‌شده</div>
        <div class="class-card-label"><span class="badge paid">کلاس گروهی</span></div>
      </div>
      <div class="s-actions class-card-actions">
        <button class="btn small ${cls.classLink?'':'secondary'} class-link-btn" type="button" data-class-link="${escapeHtml(cls.id)}">${cls.classLink?'ورود به کلاس':'افزودن لینک'}</button>
      </div>
    `;
    el.onclick=()=>{ activeClassId=cls.id; expandedSessionId=null; showNewSessionForm=false; render(); };
    const classLinkBtn = el.querySelector('[data-class-link]');
    if(classLinkBtn){
      classLinkBtn.onclick=(e)=>{
        e.stopPropagation();
        if(cls.classLink) window.open(cls.classLink, '_blank', 'noopener,noreferrer');
        else { modal={type:'edit-class', id:cls.id}; render(); }
      };
    }
    grid.appendChild(el);
  });
  root.appendChild(grid);
}

function renderClassDetail(root){

  const back = document.createElement('button');
  back.className='back-btn';

  head.querySelector('#edit-cls').onclick=()=>{ modal={type:'edit-class', id:cls.id}; render(); };
  head.querySelector('#del-cls').onclick=()=>{ modal={type:'confirm-delete-class', id:cls.id}; render(); };
  root.appendChild(head);

  // enrolled students
  const enrollCard = document.createElement('div');
  enrollCard.className='card';
  const enrollHead = document.createElement('div');
  enrollHead.style.cssText='display:flex;justify-content:space-between;align-items:center;';
  enrollHead.innerHTML = `<h2 class="section-title" style="margin:0;">دانش‌آموزان این کلاس</h2>`;
  const newStudentBtn = document.createElement('button');
  newStudentBtn.className='btn small';
  newStudentBtn.textContent='+ دانش‌آموز جدید در این کلاس';
  newStudentBtn.onclick=()=>{ modal={type:'add-roster', presetClassId:cls.id}; render(); };
  enrollHead.appendChild(newStudentBtn);
  enrollCard.appendChild(enrollHead);

  const enrolledIds = cls.studentIds||[];
  const enrolledStudents = enrolledIds.map(id=>state.roster.find(r=>r.id===id)).filter(Boolean);
  const notEnrolled = state.roster.filter(r=>!enrolledIds.includes(r.id));

  if(enrolledStudents.length===0){
    const e=document.createElement('div');
    e.className='empty';
    e.textContent='هنوز دانش‌آموزی به این کلاس اضافه نشده است.';
    enrollCard.appendChild(e);
  }else{
    const list = document.createElement('div');
    enrolledStudents.forEach(r=>{
      const row = document.createElement('div');
      row.className='class-student-row';
      row.innerHTML = `<div class="class-student-main"><div class="student-mini-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M5 20c.8-4.1 3.1-6.1 7-6.1s6.2 2 7 6.1"></path></svg></div><div><div style="font-weight:700;">${escapeHtml(r.name)}</div><div class="s-meta">${r.phone?escapeHtml(r.phone):'بدون شماره تماس'}</div></div></div><div class="student-actions"><button class="btn secondary small private-join" data-private="${r.id}">${r.classLink?'ورود به جلسه':'لینک جلسه'}</button><button class="btn danger small" data-remove="${r.id}">حذف</button></div>`;
      row.querySelector('[data-private]').onclick=(e)=>{
        e.stopPropagation();
        if(r.classLink) window.open(r.classLink, '_blank', 'noopener,noreferrer');
        else { modal={type:'edit-link',id:r.id}; render(); }
      };
      row.querySelector('[data-remove]').onclick=()=>{
        cls.studentIds = (cls.studentIds||[]).filter(id=>id!==r.id);
        saveData(); render();
      };
      list.appendChild(row);
    });
    if(list.lastChild) list.lastChild.style.borderBottom='none';
    enrollCard.appendChild(list);
  }

  if(notEnrolled.length>0){
    const addWrap = document.createElement('div');
    addWrap.style.cssText='margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);';
    addWrap.innerHTML = `<label style="margin-bottom:8px;">افزودن از دانش‌آموزان موجود</label>`;
    notEnrolled.forEach(r=>{
      const row = document.createElement('div');
      row.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:6px 4px;font-size:13.5px;';
      row.innerHTML = `<span>${escapeHtml(r.name)}</span><button class="btn secondary small" data-add="${r.id}">افزودن</button>`;
      row.querySelector('[data-add]').onclick=()=>{
        cls.studentIds = cls.studentIds||[];
        cls.studentIds.push(r.id);
        saveData(); render();
      };
      addWrap.appendChild(row);
    });
    enrollCard.appendChild(addWrap);
  }
  root.appendChild(enrollCard);

  // attendance
  const attCard = document.createElement('div');
  attCard.className='card';
  const attHead = document.createElement('div');
  attHead.style.cssText='display:flex;justify-content:space-between;align-items:center;';
  attHead.innerHTML=`<h2 class="section-title" style="margin:0;">حضور و غیاب</h2>`;
  const newSessionBtn = document.createElement('button');
  newSessionBtn.className='btn small';
  newSessionBtn.textContent = showNewSessionForm? 'انصراف' : '+ ثبت حضور و غیاب جدید';
  newSessionBtn.onclick=()=>{
    showNewSessionForm = !showNewSessionForm;
    if(showNewSessionForm){ const [jy,jm,jd]=todayJalali(); newSessionDate={jy,jm,jd}; }
    render();
  };
  attHead.appendChild(newSessionBtn);
  attCard.appendChild(attHead);

  if((cls.studentIds||[]).length===0){
    const e=document.createElement('div');
    e.className='empty';
    e.textContent='ابتدا حداقل یک دانش‌آموز به این کلاس اضافه کنید.';
    attCard.appendChild(e);
    root.appendChild(attCard);
    return;
  }

  if(showNewSessionForm){
    const form = document.createElement('div');
    form.style.cssText='background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0;';
    form.innerHTML = `
      <label style="margin-bottom:8px;">تاریخ جلسه (شمسی)</label>
      <div class="row">
        <div class="field"><select id="ns-day"></select></div>
        <div class="field"><select id="ns-month"></select></div>
        <div class="field"><select id="ns-year"></select></div>
      </div>
      <button class="btn small" id="ns-confirm" style="width:100%;">ثبت جلسه و ادامه به حضور و غیاب</button>
    `;
    const daySel = form.querySelector('#ns-day');
    const monthSel = form.querySelector('#ns-month');
    const yearSel = form.querySelector('#ns-year');
    const dCount = daysInJalaliMonth(newSessionDate.jm);
    for(let d=1; d<=dCount; d++) daySel.innerHTML += `<option value="${d}" ${d===newSessionDate.jd?'selected':''}>${faDigits(d)}</option>`;
    JALALI_MONTHS.forEach((m,i)=>{ monthSel.innerHTML += `<option value="${i+1}" ${i+1===newSessionDate.jm?'selected':''}>${m}</option>`; });
    const [ty] = todayJalali();
    for(let y=ty-2; y<=ty+1; y++) yearSel.innerHTML += `<option value="${y}" ${y===newSessionDate.jy?'selected':''}>${faDigits(y)}</option>`;
    monthSel.onchange=()=>{
      newSessionDate.jm = Number(monthSel.value);
      const nd = daysInJalaliMonth(newSessionDate.jm);
      if(newSessionDate.jd>nd) newSessionDate.jd=nd;
    };
    daySel.onchange=()=>{ newSessionDate.jd = Number(daySel.value); };
    yearSel.onchange=()=>{ newSessionDate.jy = Number(yearSel.value); };
    form.querySelector('#ns-confirm').onclick=()=>{
      const {jy,jm,jd} = newSessionDate;
      const session = {
        id:uid(), jy, jm, jd,
        label: jalaliLabel(jy,jm,jd),
        sortKey: jalaliSortKey(jy,jm,jd),
        attendance: {}
      };
      (cls.studentIds||[]).forEach(sid=>{ session.attendance[sid]={status:'present', note:''}; });
      cls.sessions = cls.sessions||[];
      cls.sessions.push(session);
      showNewSessionForm=false;
      expandedSessionId=session.id;
      saveData(); render();
    };
    attCard.appendChild(form);
  }

  const sessions = [...(cls.sessions||[])].sort((a,b)=>b.sortKey-a.sortKey);
  if(sessions.length===0 && !showNewSessionForm){
    const e=document.createElement('div');
    e.className='empty';
    e.textContent='هنوز جلسه‌ای برای حضور و غیاب ثبت نشده است.';
    attCard.appendChild(e);
  }

  sessions.forEach(session=>{
    const ids = cls.studentIds||[];
    const presentCount = ids.filter(id=>getAttendance(session,id).status==='present').length;
    const absentCount = ids.filter(id=>getAttendance(session,id).status==='absent').length;
    const row = document.createElement('div');
    row.className='term-block';
    row.style.cursor='pointer';
    const expanded = expandedSessionId===session.id;
    row.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div style="font-weight:700;">${session.label}</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <span class="badge paid">${presentCount.toLocaleString('fa-IR')} حاضر</span>
          <span class="badge due">${absentCount.toLocaleString('fa-IR')} غایب</span>
          <button class="btn secondary small" data-share-session="${session.id}" title="اشتراک‌گذاری">اشتراک‌گذاری</button>
          <button class="btn danger small" data-del-session="${session.id}">حذف</button>
        </div>
      </div>
    `;
    row.querySelector('[data-del-session]').onclick=(e)=>{
      e.stopPropagation();
      cls.sessions = cls.sessions.filter(s=>s.id!==session.id);
      if(expandedSessionId===session.id) expandedSessionId=null;
      saveData(); render();
    };
    row.querySelector('[data-share-session]').onclick=(e)=>{
      e.stopPropagation();
      shareSession(cls, session);
    };
    row.addEventListener('click',(e)=>{
      if(e.target.closest('[data-del-session]') || e.target.closest('[data-share-session]')) return;
      expandedSessionId = expanded? null : session.id;
      render();
    });
    attCard.appendChild(row);

    if(expanded){
      const grid = document.createElement('div');
      grid.style.cssText='margin-top:-4px;margin-bottom:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 14px;';
      ids.forEach(sid=>{
        const student = state.roster.find(r=>r.id===sid);
        if(!student) return;
        const a = getAttendance(session, sid);
        const line = document.createElement('div');
        line.style.cssText='padding:8px 0;border-bottom:1px solid var(--line);';
        line.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:13.5px;">${escapeHtml(student.name)}</span>
            <div style="display:flex;gap:6px;align-items:center;">
              <button class="btn small ${a.status==='present'?'':'secondary'}" data-mark="present" style="${a.status==='present'?'':'opacity:.55;'}">حاضر</button>
              <button class="btn danger small" style="${a.status==='absent'? '':'opacity:.55;background:var(--card);'}" data-mark="absent">غایب</button>
              <button data-note title="${a.note?'ویرایش یادداشت':'افزودن یادداشت'}" style="background:none;border:none;cursor:pointer;padding:4px;border-radius:6px;display:flex;color:${a.note?'var(--primary)':'var(--ink-faint)'};">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              </button>
            </div>
          </div>
          ${a.note? `<div style="font-size:12px;color:var(--ink-faint);margin-top:4px;">📝 ${escapeHtml(a.note)}</div>` : ''}
        `;
        line.querySelectorAll('[data-mark]').forEach(btn=>{
          btn.onclick=()=>{
            setAttendanceStatus(session, sid, btn.dataset.mark);
            saveData(); render();
          };
        });
        line.querySelector('[data-note]').onclick=()=>{
          const note = window.prompt(`یادداشت برای ${student.name} (جلسه ${session.label}):`, a.note||'');
          if(note!==null){ setAttendanceNote(session, sid, note.trim()); saveData(); render(); }
        };
        grid.appendChild(line);
      });
      if(grid.lastChild) grid.lastChild.style.borderBottom='none';
      attCard.appendChild(grid);
    }
  });

  root.appendChild(attCard);
}

        <small>یا برای انتخاب فایل کلیک کنید<br>PNG، JPG یا SVG — حداکثر ۳ مگابایت</small>
      </label>
    </div>

    <div class="field"><label>زیرعنوان (مثلاً نام مدرسه/آموزشگاه)</label><input id="c-school" value="${escapeHtml(cert.schoolName)}"></div>
    <div class="field"><label>عنوان لوح</label><input id="c-title" value="${escapeHtml(cert.title)}"></div>

  form.querySelector('#c-number').oninput=(e)=>{ cert.certNumber = e.target.value; renderCertPreview(preview); };
  form.querySelector('#c-school').oninput=(e)=>{ cert.schoolName = e.target.value; renderCertPreview(preview); };
  form.querySelector('#c-title').oninput=(e)=>{ cert.title = e.target.value; renderCertPreview(preview); };
  form.querySelector('#c-course').oninput=(e)=>{ cert.course = e.target.value; renderCertPreview(preview); };
  form.querySelector('#c-body').oninput=(e)=>{ cert.body = e.target.value; renderCertPreview(preview); };
  form.querySelector('#c-signer').oninput=(e)=>{ cert.signer = e.target.value; renderCertPreview(preview); };
  form.querySelector('#c-regen').onclick=()=>{
    cert.body = defaultCertBody(certStudentName(), cert.course);
    render();
  };

  // logo: file picker + drag & drop
  const handleLogoFile = (file)=>{
    if(!file) return;
    if(!/^image\//.test(file.type)){ alert('فقط فایل تصویری (PNG، JPG، SVG و ...) قابل قبول است.'); return; }
    if(file.size > 3*1024*1024){ alert('حجم تصویر باید کمتر از ۳ مگابایت باشد.'); return; }
    const reader = new FileReader();
    reader.onload=()=>{ cert.logoDataUrl = reader.result; cert.logoName = file.name; cert.logoSize = file.size; render(); };
    reader.readAsDataURL(file);
  };
  form.querySelector('#c-logo').onchange=(e)=>handleLogoFile(e.target.files[0]);
  const logoDrop = form.querySelector('#c-logo-drop');
  ['dragenter','dragover'].forEach(ev=>logoDrop.addEventListener(ev,(e)=>{ e.preventDefault(); logoDrop.classList.add('dragover'); }));
  ['dragleave','dragend'].forEach(ev=>logoDrop.addEventListener(ev,()=>logoDrop.classList.remove('dragover')));
  logoDrop.addEventListener('drop',(e)=>{
    e.preventDefault();
    logoDrop.classList.remove('dragover');
    handleLogoFile(e.dataTransfer && e.dataTransfer.files[0]);
  });
  const logoRemoveBtn = form.querySelector('#c-logo-remove');
  if(logoRemoveBtn) logoRemoveBtn.onclick=()=>{ cert.logoDataUrl=null; cert.logoName=''; cert.logoSize=0; render(); };

  const daySel = form.querySelector('#c-day');
  const monthSel = form.querySelector('#c-month');
  const yearSel = form.querySelector('#c-year');
  const dCount = daysInJalaliMonth(cert.jm);
  for(let d=1; d<=dCount; d++) daySel.innerHTML += `<option value="${d}" ${d===cert.jd?'selected':''}>${faDigits(d)}</option>`;

// The certificate is designed at A4 proportions (long side 900px) and scaled to fit the preview.
// Export always renders that design size, so preview and file are identical.
const CERT_DESIGN_LONG = 900;
const CERT_DESIGN_SHORT = CERT_DESIGN_LONG * 210 / 297;
const CERT_EXPORT_LONG = 3508; // A4 at ~300dpi
function certIsPortrait(){ return !!cert && cert.orientation==='portrait'; }
function getCertDims(){
  const p = certIsPortrait();
  return p
    ? { w:CERT_DESIGN_SHORT, h:CERT_DESIGN_LONG, mmW:210, mmH:297 }
    : { w:CERT_DESIGN_LONG, h:CERT_DESIGN_SHORT, mmW:297, mmH:210 };
}
function hexToRgba(hex, a){
  const h = hex.replace('#','');
  const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function rescaleCertPreview(){
  const wrap=document.querySelector('.cert-scale-wrap');
  const page=document.getElementById('cert-canvas');
  const container=document.querySelector('.cert-preview-wrap');
  if(!wrap||!page||!container||!cert) return;
  const d=getCertDims();
  const portrait=certIsPortrait();
  const cs=getComputedStyle(container);
  const availW=Math.max(1, container.clientWidth - parseFloat(cs.paddingLeft||0) - parseFloat(cs.paddingRight||0));
  let k=availW/d.w;
  // on wide screens keep the sheet from overflowing the screen; portrait prioritizes width (bigger sheet) and the panel scrolls if needed
  if(window.innerWidth>860){
    if(portrait){
      const availH=Math.max(600, window.innerHeight*1.3);
      k=Math.min(k, availH/d.h);
    } else {
      const availH=Math.max(420, window.innerHeight-150);
      k=Math.min(k, availH/d.h);
    }
  }
  wrap.style.width=(d.w*k)+'px';
  wrap.style.height=(d.h*k)+'px';
  page.style.width=d.w+'px';
  page.style.height=d.h+'px';
  page.style.transform=`scale(${k})`;
}

function renderCertPreview(preview){
  const t = CERT_THEMES[cert.theme];
  const name = certStudentName();
  const s = cert.sizes;
  const portrait = certIsPortrait();
  const vars = `--cert-bg:${t.bg};--cert-border:${t.border};--cert-accent:${t.accent};--cert-soft:${hexToRgba(t.border,.38)};--cert-tint:${hexToRgba(t.border,.11)};--cert-tint0:${hexToRgba(t.border,0)};`;
  const mark = `<div class="cert-mark"><span>د</span></div>`;
  preview.innerHTML = `
    <div class="cert-scale-wrap">
      <div id="cert-canvas" class="cert-page ${portrait?'is-portrait':'is-landscape'}" style="${vars}">
        <div class="cert-watermark"><div class="cert-wm-img" style="background-image:url('${cert.logoDataUrl || DANIA_LOGO_DATA_URL}');"></div></div>
        <div class="cert-border"><i class="cert-corner tl"></i><i class="cert-corner tr"></i><i class="cert-corner bl"></i><i class="cert-corner br"></i></div>
        <div class="cert-border-inner"></div>
        ${cert.certNumber ? `<div class="cert-number">شماره ${escapeHtml(cert.certNumber)}</div>` : ''}
        <div class="cert-frame">

            <img class="cert-logo" src="${cert.logoDataUrl || DANIA_LOGO_DATA_URL}" alt="لوگوی دانیا">

            <div class="cert-divider"><i></i></div>
          </div>
          <div class="cert-main">
            <div class="cert-sub">این گواهی با افتخار تقدیم می‌شود به</div>
            <div class="cert-name" style="font-size:${s.name}px;">${escapeHtml(name || '.......................')}</div>
            <div class="cert-body" style="font-size:${s.body}px;">${escapeHtml(cert.body)}</div>

          </div>

  if(preview.isConnected) rescaleCertPreview();

function prepareCertificateExport(node){
  const d=getCertDims();
  const previous={transform:node.style.transform,width:node.style.width,height:node.style.height};
  node.style.transform='none';
  node.style.width=`${d.w}px`;
  node.style.height=`${d.h}px`;
  return ()=>{node.style.transform=previous.transform;node.style.width=previous.width;node.style.height=previous.height;rescaleCertPreview();};
}

async function renderCertificateCanvas(){
  const node=document.getElementById('cert-canvas');
  if(!node) throw new Error('Certificate canvas not found');
  if(typeof html2canvas==='undefined') throw new Error('html2canvas is not loaded');
  const d=getCertDims();
  const restore=prepareCertificateExport(node);
  try{
    if(document.fonts){
      try{ await document.fonts.load('700 38px "B Titr"'); }catch(e){}
      try{ await document.fonts.load('normal 38px "Vazirmatn"'); }catch(e){}
      try{ await document.fonts.load('800 38px "Vazirmatn"'); }catch(e){}
      try{ await document.fonts.ready; }catch(e){}
    }
    const images=[...node.querySelectorAll('img')];
    await Promise.all(images.map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=resolve;img.onerror=resolve;})));
    return await html2canvas(node,{width:d.w,height:d.h,scale:CERT_EXPORT_LONG/CERT_DESIGN_LONG,backgroundColor:null,useCORS:true,allowTaint:false,logging:false,imageTimeout:15000});
  }finally{restore();}
}

function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function downloadCertificateImage(){
  try{
    const canvas=await renderCertificateCanvas(),name=certStudentName()||'loh-taghdir';
    canvas.toBlob(blob=>{if(!blob){alert('خطا در ساخت تصویر لوح.');return;}downloadBlob(blob,`${name.replace(/\s+/g,'-')}.png`);},'image/png');
  }catch(e){console.error(e);alert('خطا در ساخت تصویر لوح. لطفاً دوباره امتحان کنید.');}
}

async function downloadCertificatePDF(){
  try{
    if(!window.jspdf || !window.jspdf.jsPDF){alert('ابزار ساخت PDF بارگذاری نشده است. اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.');return;}
    const canvas=await renderCertificateCanvas();
    const {jsPDF}=window.jspdf; const d=getCertDims();
    const pdf=new jsPDF({orientation:certIsPortrait()?'portrait':'landscape',unit:'mm',format:[d.mmW,d.mmH],compress:true});
    const imgData=canvas.toDataURL('image/png',1.0);
    pdf.addImage(imgData,'PNG',0,0,d.mmW,d.mmH,undefined,'FAST');
    const name=certStudentName()||'loh-taghdir';pdf.save(`${name.replace(/\s+/g,'-')}.pdf`);
  }catch(e){console.error(e);alert('خطا در ساخت PDF لوح. لطفاً دوباره امتحان کنید.');}
}

function printCertificate(){
  const page=document.getElementById('cert-canvas');if(!page){window.print();return;}
  const pageStyle=document.createElement('style');
  pageStyle.textContent=`@page{size:A4 ${certIsPortrait()?'portrait':'landscape'};margin:0}`;
  document.head.appendChild(pageStyle);
  const restore=prepareCertificateExport(page),restorePrint=()=>{restore();pageStyle.remove();window.removeEventListener('afterprint',restorePrint);};
  window.addEventListener('afterprint',restorePrint);setTimeout(()=>window.print(),30);
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

      if(editing){ c.name=name; c.classLink=classLink; }
      else{
        const newCls = {id:uid(), name, classLink, studentIds:[], sessions:[]};
        state.classes.push(newCls);
        activeClassId = newCls.id;
      }
      modal=null; saveData(); render();
    };
  }

  if(modal.type==='confirm-delete-class'){
    const c = state.classes.find(x=>x.id===modal.id);
    const title=document.createElement('h3');
    title.textContent='حذف کلاس';
    box.appendChild(title);
    const p=document.createElement('p');
    p.style.cssText='font-size:14px;color:var(--ink-soft);margin-bottom:16px;';
    p.textContent = `آیا از حذف کلاس «${c.name}» و تمام سوابق حضور و غیابش مطمئن هستید؟ این عمل قابل بازگشت نیست.`;
    box.appendChild(p);
    const row=document.createElement('div');
    row.style.cssText='display:flex;gap:8px;justify-content:flex-end;';
    row.innerHTML=`<button class="btn secondary" id="cancel">انصراف</button><button class="btn danger" id="confirm">حذف کن</button>`;
    box.appendChild(row);
    row.querySelector('#cancel').onclick=()=>{ modal=null; render(); };
    row.querySelector('#confirm').onclick=()=>{
      state.classes = state.classes.filter(x=>x.id!==modal.id);
      modal=null; activeClassId=null; saveData(); render();
    };
  }

  bg.appendChild(box);
  $app.appendChild(bg);
}

restoreSession();

function examInput(label,id,value,extra=''){return `<div class="field"><label>${label}</label><input id="${id}" value="${examEsc(value)}" ${extra}></div>`;}

    </div>

function rescaleExamPreview(){
  const wrap=document.querySelector('.exam-preview-wrap');
  const paper=document.getElementById('exam-preview-paper');
  if(!wrap||!paper)return;
  const base=794;
  const available=Math.max(280,wrap.clientWidth-8);
  const scale=Math.min(1,available/base);
  wrap.style.setProperty('--exam-scale',scale.toFixed(4));
  wrap.style.height=(1123*scale+24)+'px';
}
if(!window.__examResizeBound){
  window.__examResizeBound=true;
  window.addEventListener('resize',()=>{if(activeTab==='exam')requestAnimationFrame(rescaleExamPreview);});
}
